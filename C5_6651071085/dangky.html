<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ShopVN - Đăng ký tài khoản</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 20px;
    }
    main {
        max-width: 600px;
        margin: 0 auto;
    }
    section {
        background-color: #ffffff;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        padding: 20px 25px 25px 25px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1 {
        text-align: center;
        font-size: 20px;
        color: #222;
        margin-top: 0;
        margin-bottom: 20px;
    }
    fieldset {
        border: 1px solid #b9d3ee;
        border-radius: 5px;
        margin-bottom: 18px;
        padding: 12px 15px 15px 15px;
    }
    legend {
        font-weight: bold;
        color: #1a5fb4;
        padding: 0 6px;
    }
    .form-row {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }
    .form-row label {
        width: 200px;
        min-width: 200px;
        font-size: 14px;
        color: #333;
    }
    .form-row .field-wrap {
        flex: 1;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="url"],
    input[type="number"],
    input[type="date"],
    input[type="search"] {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #b9c4d0;
        border-radius: 4px;
        font-size: 14px;
    }
    input[type="range"] {
        width: 80%;
        vertical-align: middle;
    }
    .range-value {
        margin-left: 8px;
        font-size: 13px;
        color: #555;
    }
    .radio-group label,
    .checkbox-group label {
        width: auto;
        margin-right: 15px;
        font-weight: normal;
    }
    .radio-group, .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
    }
    input[type="color"] {
        width: 60px;
        height: 30px;
        padding: 0;
        border: 1px solid #b9c4d0;
        border-radius: 4px;
    }
    input[type="file"] {
        font-size: 13px;
    }
    .btn-row {
        text-align: center;
        margin-top: 20px;
    }
    input[type="submit"] {
        background-color: #1a73e8;
        color: #fff;
        border: none;
        padding: 9px 22px;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        margin-right: 10px;
    }
    input[type="submit"]:hover {
        background-color: #1558b0;
    }
    input[type="reset"] {
        background-color: #e0e0e0;
        color: #333;
        border: none;
        padding: 9px 22px;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
    }
    input[type="reset"]:hover {
        background-color: #cfcfcf;
    }
    small.hint {
        display: block;
        color: #888;
        font-size: 11px;
        margin-top: 3px;
    }
</style>
</head>
<body>

<main>
    <section>
        <h1>Đăng ký tài khoản mới</h1>

        <form action="xu_ly_dangky.php" method="POST" enctype="multipart/form-data" name="formDangKy" id="formDangKy">

            <!-- Fieldset 1: Thông tin cơ bản -->
            <fieldset>
                <legend>Thông tin cơ bản</legend>

                <div class="form-row">
                    <label for="hoten">Họ và tên:</label>
                    <div class="field-wrap">
                        <input type="text" name="hoten" id="hoten" placeholder="Nguyễn Văn An" required maxlength="100">
                    </div>
                </div>

                <div class="form-row">
                    <label for="email">Email:</label>
                    <div class="field-wrap">
                        <input type="email" name="email" id="email" placeholder="example@gmail.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <label for="matkhau">Mật khẩu:</label>
                    <div class="field-wrap">
                        <input type="password" name="matkhau" id="matkhau" minlength="8" required>
                    </div>
                </div>

                <div class="form-row">
                    <label for="sdt">Số điện thoại:</label>
                    <div class="field-wrap">
                        <input type="tel" name="sdt" id="sdt" pattern="[0-9]{10}" placeholder="0901234567">
                    </div>
                </div>
            </fieldset>

            <!-- Fieldset 2: Thông tin cá nhân -->
            <fieldset>
                <legend>Thông tin cá nhân</legend>

                <div class="form-row">
                    <label for="tuoi">Tuổi:</label>
                    <div class="field-wrap">
                        <input type="number" name="tuoi" id="tuoi" min="16" max="99" step="1" value="18">
                    </div>
                </div>

                <div class="form-row">
                    <label for="ngaysinh">Ngày sinh:</label>
                    <div class="field-wrap">
                        <input type="date" name="ngaysinh" id="ngaysinh" min="1950-01-01" max="2010-12-31">
                    </div>
                </div>

                <div class="form-row">
                    <label>Giới tính:</label>
                    <div class="field-wrap radio-group">
                        <label><input type="radio" name="gioitinh" value="nam"> Nam</label>
                        <label><input type="radio" name="gioitinh" value="nu"> Nữ</label>
                        <label><input type="radio" name="gioitinh" value="khac"> Khác</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="mauua">Màu yêu thích:</label>
                    <div class="field-wrap">
                        <input type="color" name="mauua" id="mauua" value="#FF6B6B">
                    </div>
                </div>
            </fieldset>

            <!-- Fieldset 3: Sở thích & Cài đặt -->
            <fieldset>
                <legend>Sở thích &amp; Cài đặt</legend>

                <div class="form-row">
                    <label for="soikim">Tìm kiếm sở thích:</label>
                    <div class="field-wrap">
                        <input type="search" name="soikim" id="soikim" placeholder="Ví dụ: đọc sách, chơi game...">
                    </div>
                </div>

                <div class="form-row">
                    <label for="chitieu">Mức chi tiêu/tháng (VNĐ):</label>
                    <div class="field-wrap">
                        <input type="range" name="chitieu" id="chitieu" min="0" max="50000000" step="500000" value="5000000"
                               oninput="document.getElementById('chitieuValue').textContent = Number(this.value).toLocaleString('vi-VN');">
                        <span class="range-value" id="chitieuValue">5.000.000</span>
                    </div>
                </div>

                <div class="form-row">
                    <label>Sở thích (chọn nhiều):</label>
                    <div class="field-wrap checkbox-group">
                        <label><input type="checkbox" name="st_docsach" value="doc"> Đọc sách</label>
                        <label><input type="checkbox" name="st_game" value="game"> Chơi game</label>
                        <label><input type="checkbox" name="st_dulich" value="dulich"> Du lịch</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="website">Website cá nhân:</label>
                    <div class="field-wrap">
                        <input type="url" name="website" id="website" placeholder="https://example.com">
                    </div>
                </div>

                <div class="form-row">
                    <label for="avatar">Ảnh đại diện:</label>
                    <div class="field-wrap">
                        <input type="file" name="avatar" id="avatar" accept="image/png, image/jpeg">
                    </div>
                </div>
            </fieldset>

            <div class="btn-row">
                <input type="submit" value="Đăng ký ngay">
                <input type="reset" value="Nhập lại">
            </div>

        </form>
    </section>
</main>

</body>
</html>
